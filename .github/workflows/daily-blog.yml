name: 📝 Blog post (GPT) — AllGrafika.pl

# Fully automatic (docs/specs/23-blog-bot.md): three times a week the bot picks the next topic from the researched
# e-commerce plan (landing-page/scripts/blog-keywords.json – cluster rotation, seasonal windows, pillar guides),
# writes the article, rejects drafts that fail the quality gates and regenerates them with feedback. The landing
# page is then linted, built and prerendered as a safety check, and only then the post is pushed to main – Vercel
# deploys it. No pull request to merge. Every run ends with a summary of what happened and why.
#
# Cadence: Mon/Wed/Fri instead of daily (spec 23, decision D2) – longer pillar guides and fewer, better articles;
# keep PUBLISH_WEEKDAYS in landing-page/scripts/blog_plan.py in sync with the cron below.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bez API i bez publikacji – przykładowy artykuł, sprawdzenie planu, bramek jakości i buildu"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1,3,5" # pon, śr, pt 06:00 UTC

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests -q

      - name: Topic plan is valid (clusters, links, sources, no Allegro)
        id: plan
        run: |
          python3 landing-page/scripts/blog_plan.py --validate
          {
            echo "### Następne tematy z planu"
            echo '```json'
            python3 landing-page/scripts/blog_plan.py --next 5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the article (AI, quality gates, up to 3 drafts per topic)
        id: article
        env:
          # GitHub Models accepts the workflow token (permission `models: read`).
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: with this secret the bot calls OpenAI directly and uses GitHub Models only as a fallback.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          BLOG_PUBLISH: direct
        run: python3 landing-page/scripts/generate-blog-post.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: No duplicate blog posts (topic or content)
        id: duplicates
        run: python3 landing-page/scripts/check_blog_duplicates.py

      - name: Lint, format, build and prerender the landing page (same gates as CI)
        id: build
        working-directory: landing-page
        run: |
          npm ci
          # The same gates as the CI landing job – a post that fails them never reaches main.
          npm run lint
          npm run format:check
          npm run build

      - name: The new article page was prerendered
        id: prerender
        if: steps.article.outputs.slug != ''
        working-directory: landing-page
        run: |
          test -f "dist/blog/${{ steps.article.outputs.slug }}/index.html"
          grep -q 'rel="canonical" href="https://allgrafika.pl/blog/${{ steps.article.outputs.slug }}"' "dist/blog/${{ steps.article.outputs.slug }}/index.html"

      - name: Publish to main (Vercel deploys the landing page)
        id: publish
        if: steps.article.outputs.slug != '' && inputs.dry_run != true
        env:
          TITLE: ${{ steps.article.outputs.title }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add landing-page/src/data landing-page/public/sitemap.xml landing-page/scripts/blog-keywords-used.json
          git commit -m "feat(blog): ${TITLE} ($(date -u +%F))"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          echo "::error::Could not push the article to main"
          exit 1

      - name: Wait until the article is live
        id: live
        if: steps.article.outputs.slug != '' && inputs.dry_run != true
        run: |
          url="https://allgrafika.pl/blog/${{ steps.article.outputs.slug }}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then echo "Live: $url"; exit 0; fi
            sleep 15
          done
          echo "::warning::$url is not live after 10 minutes – check the Vercel deployment"

      - name: Run summary
        if: always()
        env:
          PLAN: ${{ steps.plan.outcome }}
          ARTICLE: ${{ steps.article.outcome }}
          DUPLICATES: ${{ steps.duplicates.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PRERENDER: ${{ steps.prerender.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          LIVE: ${{ steps.live.outcome }}
          SLUG: ${{ steps.article.outputs.slug }}
          KEYWORD: ${{ steps.article.outputs.keyword }}
          WORDS: ${{ steps.article.outputs.words }}
          DRY: ${{ inputs.dry_run == true && 'tak' || 'nie' }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped|"") echo "⏭️";; *) echo "⚠️ $1";; esac; }
          {
            echo "### Wynik przebiegu (dry run: ${DRY})"
            echo ""
            echo "| Krok | Wynik |"
            echo "|---|---|"
            echo "| Plan tematów | $(icon "$PLAN") |"
            echo "| Artykuł i bramki jakości | $(icon "$ARTICLE") |"
            echo "| Brak duplikatów | $(icon "$DUPLICATES") |"
            echo "| Lint, format, build, prerender | $(icon "$BUILD") |"
            echo "| Strona wpisu w buildzie | $(icon "$PRERENDER") |"
            echo "| Publikacja na main | $(icon "$PUBLISH") |"
            echo "| Wpis online | $(icon "$LIVE") |"
            echo ""
            if [ -n "$SLUG" ]; then echo "Wpis: https://allgrafika.pl/blog/${SLUG} · fraza: ${KEYWORD} · ${WORDS} słów"; fi
            if [ "$ARTICLE" = "failure" ]; then echo "**Artykuł nie przeszedł bramek jakości** – powody szkiców są wyżej w podsumowaniu; nic nie zostało opublikowane."; fi
            if [ "$BUILD" = "failure" ] || [ "$DUPLICATES" = "failure" ]; then echo "**Strona nie przeszła kontroli** – wpis nie trafił na main; sprawdź log kroku."; fi
          } >> "$GITHUB_STEP_SUMMARY"
