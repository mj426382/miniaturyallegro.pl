name: 📝 Daily blog post (GPT) — AllGrafika.pl

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nie wołaj API ani nie twórz PR – użyj przykładowego artykułu i tylko sprawdź generator"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"   # codziennie 06:00 UTC

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      models: read

    # `secrets` is not allowed in a step's `if:` (GitHub rejects the whole workflow) – expose a flag instead.
    env:
      HAS_PAT: ${{ secrets.PAT_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests -q

      - name: Generate blog post, update registry and create PR
        env:
          # GitHub Models accepts the workflow token (permission `models: read`).
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: with this secret the bot calls OpenAI directly and uses GitHub Models only as a fallback.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A PAT lets the PR trigger CI; without it the PR is still opened but checks will not run.
          GH_TOKEN: ${{ secrets.PAT_TOKEN != '' && secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          BLOG_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: python3 landing-page/scripts/generate-blog-post.py

      - name: Warn when the PR cannot trigger CI
        if: env.HAS_PAT != 'true'
        run: echo "::warning::PAT_TOKEN secret is not set – the blog PR was opened with GITHUB_TOKEN, so CI will not run on it and auto-merge stays disabled."
