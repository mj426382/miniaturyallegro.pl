name: IndexNow – allgrafika.pl

# Spec 26 (AC-SEO-028..036): after every successful production deployment of the landing page, tell IndexNow
# (Bing, Yandex, Seznam, Naver) which sitemap URLs were added, changed (<lastmod>) or removed since the previous
# successful production deployment. Vercel's GitHub integration creates the deployments; the landing project's
# environment is "Production – miniaturyallegro-pl" (the app's "Production – miniaturyallegro-ui" is ignored).
# Blog bot posts (Mon/Wed/Fri, pushed to main) are deployed the same way, so they are submitted too.
# The script never fails the run on IndexNow / network errors – they show up as warnings in the run summary.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      since:
        description: "Baseline commit (sha) – submit URLs changed since it. Empty: the previous successful production deployment of another commit."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Only print what would be submitted"
        type: boolean
        default: true

permissions:
  contents: read
  deployments: read

jobs:
  indexnow:
    name: Submit changed URLs to IndexNow
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production – miniaturyallegro-pl')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, never cancelled: consecutive deployments are processed in order and each one is compared
    # with the deployment before it, so no URL range is submitted twice.
    concurrency:
      group: indexnow-landing
      cancel-in-progress: false
    steps:
      - name: Checkout the deployed commit (full history – the baseline sitemap is read with git show)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Submit the URLs changed since the previous production deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha || github.sha }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: |
          args=(--sha "$DEPLOYMENT_SHA")
          if [ -n "$SINCE" ]; then
            args+=(--since "$SINCE")
          else
            args+=(--github-previous)
            if [ -n "$DEPLOYMENT_ID" ]; then args+=(--deployment-id "$DEPLOYMENT_ID"); fi
          fi
          if [ "$DRY_RUN" = "1" ]; then args+=(--dry-run); fi
          node landing-page/scripts/indexnow.js "${args[@]}"
