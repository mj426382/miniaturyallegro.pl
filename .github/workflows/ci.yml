name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specs:
    name: Specs – traceability & API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Every acceptance criterion has a test (and vice versa)
        run: node scripts/check-spec-coverage.js --report
      - name: Legal copies are identical in the app and on the landing page
        run: |
          diff -q frontend/src/legal/RegulaminContent.tsx landing-page/src/legal/RegulaminContent.tsx
          diff -q frontend/src/legal/PolitykaContent.tsx landing-page/src/legal/PolitykaContent.tsx
          diff -q frontend/src/legal/entity.ts landing-page/src/legal/entity.ts
      - name: OpenAPI contract is committed
        run: test -s docs/api/openapi.json

  backend:
    name: Backend – lint, unit & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allgrafika_test
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm test -- --ci
      - name: Integration tests
        run: npm run test:e2e -- --ci
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5437/allgrafika_test?schema=public
      - name: Docker image builds
        run: docker build --target runner -t allgrafika-backend:ci .

  frontend:
    name: App frontend – typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          VITE_API_URL: https://server.allgrafika.pl/api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      - name: Unit tests (download helper per platform)
        run: npm test

  frontend-browsers:
    name: App frontend – desktop, phones and tablets (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  fullstack:
    name: Full stack – browser + real backend + test database (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allgrafika_e2e_test
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Sign-up → e-mail link → upload → generation on the real API
        working-directory: frontend
        run: npm run test:e2e:fullstack
        env:
          CI: 'true'
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5437/allgrafika_e2e_test?schema=public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fullstack-traces
          path: frontend/test-results
          retention-days: 7

  mobile-android:
    name: Mobile app – Android debug build (Capacitor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Bundle the app and copy it into the native project
        run: npm run build:native && npx cap sync android
      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: allgrafika-android-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  mobile-ios:
    name: Mobile app – iOS simulator build (Capacitor, unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Bundle the app and copy it into the native project (runs pod install)
        run: npm run build:native && npx cap sync ios
      - name: Build for the iOS simulator
        working-directory: frontend/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20 && exit ${PIPESTATUS[0]}

  landing:
    name: Landing page – build & prerender
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Verify prerendered output
        run: |
          test -f dist/index.html
          test -f dist/blog/index.html
          test -f dist/sitemap.xml
          grep -q 'application/ld+json' dist/index.html
          grep -q 'rel="canonical" href="https://allgrafika.pl/"' dist/index.html
          echo "Prerendered blog posts: $(ls dist/blog | wc -l)"

  landing-hydration:
    name: Landing page – hydration, budgets & demo on desktop, iPhone, Android, iPad (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('landing-page/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: 'true'
