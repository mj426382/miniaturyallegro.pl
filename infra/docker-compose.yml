services:
  postgres:
    image: postgres:15-alpine
    container_name: AllGrafika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-AllGrafika}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published on the host – only the backend container needs the database.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/mj426382/allgrafika-backend:latest
    container_name: AllGrafika_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-AllGrafika}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      B2_ENDPOINT: ${B2_ENDPOINT}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY}
      B2_REGION: ${B2_REGION:-us-west-004}
      B2_PUBLIC_URL: ${B2_PUBLIC_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      GEMINI_ASPECT_RATIO: ${GEMINI_ASPECT_RATIO:-1:1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      FREE_CREDITS_LIMIT: ${FREE_CREDITS_LIMIT:-10}
      DEFAULT_STYLE_IDS: ${DEFAULT_STYLE_IDS:-white-bg,lifestyle-home,dark-luxury}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_SUB_START: ${STRIPE_PRICE_SUB_START}
      STRIPE_PRICE_SUB_PRO: ${STRIPE_PRICE_SUB_PRO}
      ALLEGRO_CLIENT_ID: ${ALLEGRO_CLIENT_ID}
      ALLEGRO_CLIENT_SECRET: ${ALLEGRO_CLIENT_SECRET}
      ALLEGRO_SANDBOX: ${ALLEGRO_SANDBOX:-false}
      ALLEGRO_TOKEN_KEY: ${ALLEGRO_TOKEN_KEY}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      LANDING_URL: ${LANDING_URL:-https://allgrafika.pl}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-AllGrafika <no-reply@allgrafika.pl>}
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://app.allgrafika.pl}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      THROTTLE_LIMIT_PER_MINUTE: ${THROTTLE_LIMIT_PER_MINUTE:-120}
    # Bound to localhost: only the reverse proxy may reach the API, so X-Forwarded-For cannot be spoofed.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
