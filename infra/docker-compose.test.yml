# Throw-away PostgreSQL for the backend integration tests.
#   docker compose -f infra/docker-compose.test.yml up -d
#   cd backend && npm run test:e2e
services:
  postgres-test:
    image: postgres:15-alpine
    container_name: allgrafika_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: allgrafika_test
    ports:
      - "5437:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
